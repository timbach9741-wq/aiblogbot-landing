name: Supabase Keep-Alive

# admin.html 라이선스 발급 백엔드(Supabase 프로젝트 "aiblogbot", vlclmbikpfaxhxjjqwsi)는
# 무료 티어라 7일간 API 활동이 없으면 자동 일시정지된다(2026-09-07 일시정지 예고 메일
# 수신, 조치 필요 확인됨). 라이선스 발급/문의가 뜸한 주에도 활동이 끊기지 않도록
# 주 2회 가벼운 조회를 보내 활동을 유지한다.
#
# 여기서 쓰는 키는 anon(publishable) key로, admin.html/데스크톱 앱에도 이미 그대로
# 노출되어 있는 공개용 키다(실제 데이터 접근은 Supabase RLS 정책이 관리자 로그인으로만
# 제한). 요청이 RLS에 막혀 빈 결과가 와도 API 호출 자체는 발생하므로 활동으로 잡힌다.

on:
  schedule:
    - cron: '0 3 * * 1,4' # 매주 월/목 03:00 UTC(한국시간 낮 12시)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://vlclmbikpfaxhxjjqwsi.supabase.co/rest/v1/licenses?select=id&limit=1" \
            -H "apikey: sb_publishable_Ck99T-0loRBoPa8J7amcYg_YlUHkKxt"
